<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jevenator 2</title>
<style>
:root{--bg:#0b0607;--panel:#160b0c;--line:#3a1b1a;--ink:#ffd9c0;--dim:#c08a72;
--hot:#ffd23c;--warm:#ff7a3c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);padding:16px;
font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
h1{font-size:18px;letter-spacing:.16em;margin:0 0 14px;color:var(--hot)}
.wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.panel{background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:6px}
#live{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
#stage{position:relative;line-height:0}
#stage *{line-height:normal}
#stage img{display:block;width:100%;height:auto;
filter:grayscale(1) sepia(1) saturate(6) hue-rotate(-24deg) contrast(1.15)}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(
to bottom,rgba(0,0,0,0) 0 1px,rgba(0,0,0,.45) 1px 2px)}
#box{position:absolute;border:3px solid var(--hot);display:none;pointer-events:none}
#tag{position:absolute;background:var(--hot);color:#000;font-weight:700;
padding:3px 8px;font-size:15px;line-height:1.35;display:none;white-space:nowrap;
border-radius:2px}
#cells{position:absolute;inset:0;pointer-events:none;display:none}
#cells div{position:absolute;border:1px solid rgba(255,210,60,.2);font-size:11px;
line-height:1.5;color:rgba(255,210,60,.75);padding:1px 3px}
table{border-collapse:collapse}
td{border:1px solid var(--line);width:46px;height:34px;text-align:center;font-size:11px;color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
button,select,input[type=text]{background:#241011;color:var(--ink);
border:1px solid var(--line);padding:5px 10px;border-radius:4px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--hot)}
input[type=range]{width:200px;accent-color:var(--hot)}
.stat{color:var(--dim);font-size:12px}
.stat b{color:var(--ink);font-weight:600}
#targets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#targets figure{margin:0;display:flex;flex-direction:column;gap:6px;width:104px;
cursor:pointer;border:1px solid var(--line);border-radius:4px;padding:7px;
background:#1d0e0f}
#targets figure:hover{border-color:var(--warm)}
#targets .sel{border-color:var(--hot);background:#2a1414}
#targets img{width:100%;height:64px;object-fit:cover;border-radius:3px;display:block}
#targets figcaption{font-size:10px;color:var(--dim);line-height:1.3}
#targets .nm{color:var(--ink);font-weight:600;display:block;margin-bottom:2px}
#targets .txt{height:64px;display:flex;align-items:center;justify-content:center;
text-align:center;font-size:10px;color:var(--warm);background:#2a1414;
border-radius:3px;padding:4px;line-height:1.25}
#live{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
#err{color:#ff7060;font-size:12px;min-height:16px}
</style>
</head>
<body>
<h1>JEVENATOR 2 &mdash; JUDGMENT DAY</h1>
<div class="wrap">
  <div class="panel" style="flex:1 1 430px;max-width:470px">
    <div id="stage">
      <img id="img" alt="">
      <div id="cells"></div><div id="scan"></div><div id="box"></div><div id="tag"></div>
    </div>
    <div class="row">
      <button id="play">PLAY</button>
      <input type="range" id="seek" min="0" value="0">
      <span class="stat" id="pos"></span>
    </div>
    <div class="row">
      <label class="stat">MODE
        <select id="mode">
          <option value="single">single read</option>
          <option value="averaged" selected>averaged</option>
          <option value="prev">hint: previous frame</option>
          <option value="wrong">hint: wrong</option>
          <optgroup id="refopts" label="reference"></optgroup>
        </select>
      </label>
      <label class="stat">THR
        <input type="range" id="thr" min="0.2" max="0.9" step="0.05" value="0.55" style="width:110px">
        <span id="thrv">0.55</span>
      </label>
      <label class="stat"><input type="checkbox" id="grid"> regions</label>
    </div>
    <div class="stat" id="stats" style="margin-top:8px"></div>
    <div id="live">
      <div class="stat" style="margin-bottom:8px">TARGET</div>
      <div id="targets"></div>
      <div class="row">
        <label class="stat">API <input type="text" id="api" size="22" placeholder="http://localhost:8020"></label>
        <button id="rescan">RESCAN FRAME</button>
      </div>
      <div id="err"></div>
    </div>
  </div>
  <div class="panel">
    <div class="stat" style="margin-bottom:6px">PER-REGION PROBABILITY</div>
    <table id="tab"></table>
  </div>
</div>
</div>
<script src="data/results.js?v=ea900e44"></script>
<script>
const D = window.RESULTS;
const el = id => document.getElementById(id);
const live = {};
let i = 0, timer = null;

function layout() {
  const {cols, rows} = D, c = el("cells");
  c.innerHTML = "";
  for (let k = 0; k < cols * rows; k++) {
    const r = Math.floor(k / cols), col = k % cols, d = document.createElement("div");
    d.style.cssText = `left:${100*col/cols}%;top:${100*r/rows}%;width:${100/cols}%;height:${100/rows}%`;
    d.textContent = D.labels[k];
    c.appendChild(d);
  }
}
function nbrs(i) {
  const {cols, rows} = D, r = Math.floor(i / cols), c = i % cols, out = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    const rr = r + dr, cc = c + dc;
    if ((dr || dc) && rr >= 0 && rr < rows && cc >= 0 && cc < cols) out.push(rr * cols + cc);
  }
  return out;
}
function connected(set) {
  if (set.size < 2) return true;
  const start = set.values().next().value, seen = new Set([start]), st = [start];
  while (st.length) for (const nb of nbrs(st.pop())) if (set.has(nb) && !seen.has(nb)) { seen.add(nb); st.push(nb); }
  return seen.size === set.size;
}
function groups(p, thr) {
  const {cols, rows, labels} = D, on = new Set();
  for (let k = 0; k < cols * rows; k++) if (p[labels[k]] >= thr) on.add(k);
  if (!on.size) return [];
  const out = [], remaining = new Set(on);
  while (remaining.size) {
    let start = null;
    for (const k of remaining) if (start === null || p[labels[k]] > p[labels[start]]) start = k;
    const seen = new Set([start]), st = [start];
    while (st.length) for (const nb of nbrs(st.pop())) if (remaining.has(nb) && !seen.has(nb)) { seen.add(nb); st.push(nb); }
    const rs = [...seen].map(i => Math.floor(i / cols)), cs = [...seen].map(i => i % cols);
    const inside = [];
    for (let r = Math.min(...rs); r <= Math.max(...rs); r++)
      for (let c = Math.min(...cs); c <= Math.max(...cs); c++) inside.push(r * cols + c);
    const keep = new Set(seen);
    for (const cell of inside.filter(i => !on.has(i)).sort((a, b) => p[labels[b]] - p[labels[a]])) {
      if (connected(keep)) break;
      keep.add(cell);
    }
    out.push([...keep].sort((a, b) => a - b));
    for (const k of seen) remaining.delete(k);
  }
  return out;
}
function currentMap() {
  if (live[i]) return live[i];
  const m = el("mode").value;
  if (m.startsWith("ref:")) {
    const [, name, sub] = m.split(":");
    return D.refs[name].modes[sub][i];
  }
  return D.modes[m][i];
}
function draw() {
  const {cols, rows, labels} = D, thr = +el("thr").value, p = currentMap();
  el("img").src = "data/frames/" + D.frames[i];
  el("seek").max = D.frames.length - 1;
  el("seek").value = i;
  el("pos").textContent = `FRAME ${i + 1}/${D.frames.length}`;
  el("cells").style.display = el("grid").checked ? "block" : "none";
  for (const old of [...document.querySelectorAll(".gbox")]) old.remove();
  const found = groups(p, thr), t = el("tag");
  found.forEach((g, gi) => {
    const rs = g.map(c => Math.floor(c / cols)), cs = g.map(c => c % cols);
    const x0 = Math.min(...cs), y0 = Math.min(...rs);
    const x1 = Math.max(...cs) + 1, y1 = Math.max(...rs) + 1;
    const d = document.createElement("div");
    d.className = "gbox";
    d.style.cssText = `position:absolute;left:${100*x0/cols}%;top:${100*y0/rows}%;`
      + `width:${100*(x1-x0)/cols}%;height:${100*(y1-y0)/rows}%;pointer-events:none;`
      + `border:${gi ? "2px dashed rgba(255,210,60,.45)" : "3px solid var(--hot)"}`;
    el("stage").appendChild(d);
    if (!gi) {
      const conf = Math.max(...g.map(c => p[labels[c]]));
      t.style.display = "block";
      t.style.left = (100 * x0 / cols) + "%";
      t.style.top = `calc(${100*y0/rows}% - 25px)`;
      t.textContent = `${targetName()} ${(conf * 100).toFixed(0)}%`;
    }
  });
  if (!found.length) t.style.display = "none";
  let h = "";
  for (let r = 0; r < rows; r++) {
    h += "<tr>";
    for (let c = 0; c < cols; c++) {
      const L = labels[r * cols + c], v = p[L], a = Math.min(1, v * 1.05);
      h += `<td style="background:rgba(255,${Math.round(120+90*(1-a))},60,${a*0.85})">${L}<br>${v.toFixed(2)}</td>`;
    }
    h += "</tr>";
  }
  el("tab").innerHTML = h;
  const cells = found.length ? found[0].map(c => labels[c]).join("") : "none";
  el("stats").innerHTML = `READ <b>${live[i] ? "live" : readMs().toFixed(0) + " ms"}</b>`
    + ` &middot; REGIONS <b>${cells}</b> &middot; ${cols * rows} QUERIES`;
  paintTargets();
}
function targetName() {
  const m = el("mode").value;
  return m.startsWith("ref:") ? m.split(":")[1].replace(/_/g, " ").toUpperCase() : "JOHN CONNOR";
}
function scanRequest() {
  const m = el("mode").value, req = {frame: D.frames[i], cols: D.cols, rows: D.rows};
  if (m.startsWith("ref:")) {
    req.reference = m.split(":")[1];
    req.channel = D.ref_channel || "attached";
  } else {
    req.target = D.target;
  }
  return req;
}
function readMs() {
  const m = el("mode").value;
  return m.startsWith("ref:") ? D.refs[m.split(":")[1]].ms : D.times[i];
}
function paintTargets() {
  const host = el("targets");
  if (!host) return;
  const m = el("mode").value;
  host.innerHTML = "";
  const card = (key, label, desc, img, on) => {
    const fig = document.createElement("figure");
    fig.className = on ? "sel" : "";
    fig.innerHTML = (img ? `<img src="${img}" alt="${label}">`
      : `<div class="txt">&ldquo;${label}&rdquo;</div>`)
      + `<figcaption><span class="nm">${label}</span>${desc}</figcaption>`;
    fig.onclick = () => { el("mode").value = key; draw(); };
    host.appendChild(fig);
  };
  card("averaged", "description", D.target, null, !m.startsWith("ref:"));
  for (const name of Object.keys(D.refs || {})) {
    card(`ref:${name}:averaged`, name.replace(/_/g, " "),
         D.refs[name].description || "", `data/refs/${name}.jpg`,
         m === `ref:${name}:averaged`);
  }
}
el("play").onclick = () => {
  if (timer) { clearInterval(timer); timer = null; el("play").textContent = "PLAY"; }
  else { timer = setInterval(() => { i = (i + 1) % D.frames.length; draw(); }, 420);
         el("play").textContent = "PAUSE"; }
};
el("seek").oninput = e => { i = +e.target.value; draw(); };
el("mode").onchange = draw;
el("grid").onchange = draw;
el("thr").oninput = e => { el("thrv").textContent = (+e.target.value).toFixed(2); draw(); };
el("rescan").onclick = async () => {
  const base = el("api").value.trim();
  el("err").textContent = "";
  if (!base) { el("err").textContent = "set an API address to scan live"; return; }
  el("rescan").disabled = true;
  try {
    const r = await fetch(base.replace(/\/$/, "") + "/api/scan", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify(scanRequest()),
    });
    if (!r.ok) throw new Error(await r.text());
    live[i] = (await r.json()).probs;
    draw();
  } catch (e) { el("err").textContent = String(e).slice(0, 200); }
  finally { el("rescan").disabled = false; }
};
if (D.refs) {
  el("refopts").innerHTML = Object.keys(D.refs)
    .map(n => `<option value="ref:${n}:averaged">${n.replace(/_/g, " ")}</option>`).join("");
}
layout(); draw();
</script>
</body>
</html>
